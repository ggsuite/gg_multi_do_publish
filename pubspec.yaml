name: gg_multi_do_publish
description: "The multi-repo publish orchestrator of the gg_multi tool family - publishing all ticket repos in dependency order with skip checks, resume and rollback."
version: 2.0.0
repository: https://github.com/ggsuite/gg_multi_do_publish.git

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  gg_args: ^3.0.0
  gg_console_colors: ^2.3.0
  gg_lang: ^0.4.0
  gg_local_package_dependencies: ^3.0.0
  gg_localize_refs: ^4.0.0
  gg_log: ^1.0.6
  gg_multi_commit: ^2.0.0
  gg_multi_core: ^2.0.0
  gg_one: ^13.0.0
  gg_publish: ^4.0.0
  gg_status_printer: ^1.4.2
  mocktail: ^1.0.5
  path: ^1.9.1
  pub_semver: ^2.2.0

dev_dependencies:
  args: ^2.7.0
  gg_capture_print: ^1.0.9
  lints: ^6.1.0
  pubspec_parse: ^1.5.0
  test: ^1.31.2