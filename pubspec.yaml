name: gg_multi_do_publish
description: "The multi-repo publish orchestrator of the gg_multi tool family - publishing all ticket repos in dependency order with skip checks, resume and rollback."
version: 4.3.1
repository: https://github.com/ggsuite/gg_multi_do_publish.git

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  gg_args: ^3.2.0
  gg_console_colors: ^2.5.0
  gg_git: ^4.4.1
  gg_lang: ^0.8.0
  gg_local_package_dependencies: ^4.2.0
  gg_localize_refs: ^5.0.0
  gg_log: ^1.2.0
  gg_multi_commit: ^4.2.3
  gg_multi_core: ^4.6.0
  gg_one: ^14.4.2
  gg_process: ^1.3.0
  gg_publish: ^4.7.0
  gg_status_printer: ^1.6.0
  mocktail: ^1.0.5
  path: ^1.9.1
  pub_semver: ^2.2.1

dev_dependencies:
  args: ^2.7.0
  dna_ggsuite: ^0.2.1
  gg_capture_print: ^1.2.0
  helix: ^1.7.1
  lints: ^6.1.0
  pubspec_parse: ^1.6.0
  test: ^1.32.0